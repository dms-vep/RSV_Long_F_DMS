# Heatmaps that integrate measurements across assays

# define default displays for cell entry that can be used across multiple antibodies
cell_entry_default: &cell_entry_default
  min_times_seen: 2
  min_frac_models: 0.67
  alphabet: [A, C, D, E, F, G, H, I, K, L, M, N, P, Q, R, S, T, V, W, Y]
  init_floor_escape_at_zero: true
  init_site_escape_stat: sum
  other_phenotypes:
    cell entry:
      csv: results/func_effects/averages/293T-TIM1_entry_func_effects.csv
      stat: effect
      color_scheme: purplegreen
      max_at_least: 2
      fixed_min: -3
      init_min_value: -2.5
      le_filters:
        effect_std: 1.6

antibody_default: &antibody_default
  stat: escape_median
  color_scheme: redblue
  max_at_least: 2
  min_at_least: -2

# escape from antibodies
all_antibodies:
  <<: *cell_entry_default
  no_mean_lineplot: true
  scale_lineplot_height: 1.1
  selectable_per_antibody_heatmap: true
  lineplot_antibody_label_loc: top
  antibody_escape:
    Nirsevimab-IgG:
      <<: *antibody_default
      le_filters:
        escape_std: 1.5
      antibody_list:
        Nirsevimab-IgG: results/antibody_escape/averages/Nirsevimab-IgG_mut_effect.csv
    Nirsevimab-Fab:
      <<: *antibody_default
      le_filters:
        escape_std: 1.75
      antibody_list:
        Nirsevimab-Fab: results/antibody_escape/averages/Nirsevimab-Fab_mut_effect.csv
    Clesrovimab-IgG:
      <<: *antibody_default
      le_filters:
        escape_std: 1.75
      antibody_list:
        Clesrovimab-IgG: results/antibody_escape/averages/Clesrovimab-IgG_mut_effect.csv
    Clesrovimab-Fab:
      <<: *antibody_default
      le_filters:
        escape_std: 2.55
      antibody_list:
        Clesrovimab-Fab: results/antibody_escape/averages/Clesrovimab-Fab_mut_effect.csv
    Palivizumab-IgG:
      <<: *antibody_default
      le_filters:
        escape_std: 1.85
      antibody_list:
        Palivizumab-IgG: results/antibody_escape/averages/Palivizumab-IgG_mut_effect.csv
    Palivizumab-Fab:
      <<: *antibody_default
      le_filters:
        escape_std: 2.0
      antibody_list:
        Palivizumab-Fab: results/antibody_escape/averages/Palivizumab-Fab_mut_effect.csv
    RSM01-IgG:
