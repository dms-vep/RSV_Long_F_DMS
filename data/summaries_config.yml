        escape_std: 1.25
      antibody_list:
        hSerum_4_hSera: results/antibody_escape/averages/hSerum_4_hSera_mut_effect.csv

# averaged (mean) escape across all human sera
hSera_average:
  <<: *cell_entry_default
  no_mean_lineplot: false          # draws the mean-across-sera line
  scale_lineplot_height: 1
  selectable_per_antibody_heatmap: false
  lineplot_antibody_label_loc: top
  antibody_escape:
    human sera:                    # single set => one mean line across the 4 sera
      <<: *antibody_default
      le_filters:
        escape_std: 1.25
      antibody_list:
        hSerum_1_hSera: results/antibody_escape/averages/hSerum_1_hSera_mut_effect.csv
        hSerum_2_hSera: results/antibody_escape/averages/hSerum_2_hSera_mut_effect.csv
        hSerum_3_hSera: results/antibody_escape/averages/hSerum_3_hSera_mut_effect.csv
        hSerum_4_hSera: results/antibody_escape/averages/hSerum_4_hSera_mut_effect.csv

