    hSerum_1_hSera: &hSerum_1_hSera
      <<: *antibody_default
      le_filters:
        escape_std: 1.25
      antibody_list:
        hSerum_1_hSera: results/antibody_escape/averages/hSerum_1_hSera_mut_effect.csv
    hSerum_2_hSera: &hSerum_2_hSera
      <<: *antibody_default
      le_filters:
        escape_std: 1.25
      antibody_list:
        hSerum_2_hSera: results/antibody_escape/averages/hSerum_2_hSera_mut_effect.csv
    hSerum_3_hSera: &hSerum_3_hSera
      <<: *antibody_default
      le_filters:
        escape_std: 1.25
      antibody_list:
        hSerum_3_hSera: results/antibody_escape/averages/hSerum_3_hSera_mut_effect.csv
    hSerum_4_hSera: &hSerum_4_hSera
